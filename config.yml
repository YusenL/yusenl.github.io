  author: Yusen Liu
  DateFormat: "January 2006"
  defaultTheme: light
  disableThemeToggle: true
  hideFooter: false
  disableScrollToTop: true
  disableAnchoredHeadings: true
  ShowShareButtons: false
  ShowReadingTime: false
  ShowPostNavLinks: false
  ShowBreadCrumbs: false
  ShowCodeCopyButtons: false
  ShowToc: false
  comments: false
  math: false
  profileMode:
    enabled: true
    title: Yusen Liu
    position: PhD Student
    affiliation: University of Technology Sydney
    subtitle: "I am a PhD student in Computer Science at the University of Technology Sydney. My research focuses on deep learning for language and multimodal generation."
    imageUrl: profile.svg
    imageWidth: 160
    imageHeight: 160
    imageTitle: Yusen Liu
    researchInterests:
      - Deep Learning
      - Natural Language Generation
      - Multimodal Learning
    buttons:
      - name: News
        url: "#news"
      - name: Publications
        url: "#publications"
      - name: Services
        url: "#services"
  socialIcons:
    - name: Email
      title: Email
      url: "mailto:liuyusen96@gmail.com"
    - name: Google Scholar
      title: Google Scholar
      url: "https://scholar.google.com/citations?user=K_Fy2OUAAAAJ"
    - name: GitHub
      title: GitHub
      url: "https://github.com/YusenL"
  schema:
    publisherType: Person
    sameAs:
      - "https://github.com/YusenL"
      - "https://scholar.google.com/citations?user=K_Fy2OUAAAAJ"
