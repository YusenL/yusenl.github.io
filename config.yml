baseURL: "https://yusen.website/"
title: Yusen Liu
theme: PaperMod
locale: en
defaultContentLanguage: en
publishDir: docs
cleanDestinationDir: true
enableRobotsTXT: false
disableKinds: [taxonomy, term, RSS]

menu:
  main:
    - name: About
      url: "#about"
      weight: 1
    - name: Research
      url: "#research"
      weight: 2
    - name: Publications
      url: "#publications"
      weight: 3
    - name: Contact
      url: "#contact"
      weight: 4

params:
  description: "The personal research website of Yusen Liu, a researcher based in Sydney."
  author: Yusen Liu
  DateFormat: "January 2006"
  defaultTheme: light
  disableThemeToggle: true
  hideFooter: false
  disableScrollToTop: true
  disableAnchoredHeadings: true
  ShowShareButtons: false
  ShowReadingTime: false
  ShowPostNavLinks: false
  ShowBreadCrumbs: false
  ShowCodeCopyButtons: false
  ShowToc: false
  comments: false
  math: false
  profileMode:
    enabled: true
    title: Yusen Liu
    subtitle: "I am a researcher based in Sydney. My work spans machine learning, optimization, and applied AI, with an emphasis on reliable methods for complex real-world systems."
    imageUrl: profile.svg
    imageWidth: 160
    imageHeight: 160
    imageTitle: Yusen Liu
    buttons:
      - name: About
        url: "#about"
      - name: Research
        url: "#research"
      - name: Publications
        url: "#publications"
      - name: Contact
        url: "#contact"
  socialIcons:
    - name: Location
      url: "#contact"
    - name: GitHub
      url: "https://github.com/YusenL"
  schema:
    publisherType: Person
    sameAs:
      - "https://github.com/YusenL"
  assets:
    disableScrollBarStyle: true
    favicon: favicon.svg
    favicon16x16: favicon.svg
    favicon32x32: favicon.svg
    apple_touch_icon: favicon.svg
    theme_color: "#ffffff"
  label:
    text: Yusen Liu
  footer:
    text: "Research profile in progress"

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    guessSyntax: true
    style: autumn
