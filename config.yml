baseURL: "https://yusen.website/"
title: Yusen Liu
theme: PaperMod
locale: en
defaultContentLanguage: en
publishDir: docs
cleanDestinationDir: true
enableRobotsTXT: false
disableKinds: [taxonomy, term, RSS]

menu:
  main:
    - name: Research Interests
      url: "#research-interests"
      weight: 1
    - name: News
      url: "#news"
      weight: 2
    - name: Publications
      url: "#publications"
      weight: 3
    - name: Services
      url: "#services"
      weight: 4

params:
  description: "The personal research website of Yusen Liu, a researcher based in Sydney."
  author: Yusen Liu
  DateFormat: "January 2006"
  defaultTheme: light
  disableThemeToggle: true
  hideFooter: false
  disableScrollToTop: true
  disableAnchoredHeadings: true
  ShowShareButtons: false
  ShowReadingTime: false
  ShowPostNavLinks: false
  ShowBreadCrumbs: false
  ShowCodeCopyButtons: false
  ShowToc: false
  comments: false
  math: false
  profileMode:
    enabled: true
    title: Yusen Liu
    subtitle: "A researcher based in Sydney, working on reliable methods for complex real-world systems."
    imageUrl: profile.svg
    imageWidth: 160
    imageHeight: 160
    imageTitle: Yusen Liu
    researchInterests:
      - Machine Learning
      - Optimization
      - Applied AI
    buttons:
      - name: Research Interests
        url: "#research-interests"
      - name: News
        url: "#news"
      - name: Publications
        url: "#publications"
      - name: Services
        url: "#services"
  socialIcons:
    - name: Email
      title: Email
      url: "mailto:liuyusen96@gmail.com"
    - name: Google Scholar
      title: Google Scholar
      url: "https://scholar.google.com/citations?view_op=search_authors&mauthors=Yusen+Liu"
    - name: GitHub
      title: GitHub
      url: "https://github.com/YusenL"
  schema:
    publisherType: Person
    sameAs:
      - "https://github.com/YusenL"
  assets:
    disableScrollBarStyle: true
    favicon: favicon.svg
    favicon16x16: favicon.svg
    favicon32x32: favicon.svg
    apple_touch_icon: favicon.svg
    theme_color: "#ffffff"
  label:
    text: Yusen Liu
  footer:
    text: "Research profile in progress"

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    guessSyntax: true
    style: autumn
