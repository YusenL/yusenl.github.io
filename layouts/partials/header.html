<script>
  (() => {
    try {
      if (localStorage.getItem("pref-theme") === "dark") {
        document.body.classList.add("dark");
      }
    } catch (_) {}
  })();
</script>
<header class="header">
  <nav class="nav" aria-label="Primary navigation">
    <ul id="menu">
      {{- range site.Menus.main }}
      <li>
        <a href="{{ .URL }}" data-en="{{ .Name }}" data-zh="{{ .Params.zh | default .Name }}">{{ .Name }}</a>
      </li>
      {{- end }}
    </ul>

    <div class="nav-actions">
      <button id="language-toggle" class="nav-control language-toggle" type="button" aria-label="Switch to Chinese" title="Switch to Chinese">
        <span aria-hidden="true">中</span>
      </button>
      <button id="theme-toggle" class="nav-control theme-toggle" type="button" aria-label="Switch to dark mode" title="Switch to dark mode">
        <svg class="moon-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20.3 15.2A8.5 8.5 0 0 1 8.8 3.7a8.5 8.5 0 1 0 11.5 11.5Z"></path>
        </svg>
        <svg class="sun-icon" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="3.75"></circle>
          <path d="M12 2v2.25M12 19.75V22M4.93 4.93l1.59 1.59M17.48 17.48l1.59 1.59M2 12h2.25M19.75 12H22M4.93 19.07l1.59-1.59M17.48 6.52l1.59-1.59"></path>
        </svg>
      </button>
      <button id="menu-toggle" class="nav-control menu-toggle" type="button" aria-controls="menu" aria-expanded="false" aria-label="Open menu" title="Open menu">
        <svg class="menu-open-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 7h16M4 12h16M4 17h16"></path>
        </svg>
        <svg class="menu-close-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="m6 6 12 12M18 6 6 18"></path>
        </svg>
      </button>
    </div>
  </nav>
</header>

<script>
  document.addEventListener("DOMContentLoaded", () => {
    const body = document.body;
    const menu = document.getElementById("menu");
    const menuButton = document.getElementById("menu-toggle");
    const languageButton = document.getElementById("language-toggle");
    const themeButton = document.getElementById("theme-toggle");
    const themeMeta = document.querySelector('meta[name="theme-color"]');
    const navLinks = Array.from(menu.querySelectorAll('a[href^="#"]'));
    const setActiveLink = (hash) => {
      navLinks.forEach((link) => {
        link.classList.toggle("active", link.getAttribute("href") === hash);
      });
    };
    const initialHash = navLinks.some((link) => link.getAttribute("href") === window.location.hash)
      ? window.location.hash
      : "#about-me";
    setActiveLink(initialHash);
    let language = "en";

    try {
      language = localStorage.getItem("site-language") === "zh" ? "zh" : "en";
    } catch (_) {}

    const updateThemeLabel = () => {
      const dark = body.classList.contains("dark");
      const label = language === "zh"
        ? (dark ? "切换到白天模式" : "切换到夜间模式")
        : (dark ? "Switch to light mode" : "Switch to dark mode");
      themeButton.setAttribute("aria-label", label);
      themeButton.title = label;
      if (themeMeta) themeMeta.content = dark ? "#1d1e20" : "#ffffff";
    };

    const updateMenuLabel = () => {
      const open = menu.classList.contains("is-open");
      const label = language === "zh"
        ? (open ? "关闭菜单" : "打开菜单")
        : (open ? "Close menu" : "Open menu");
      menuButton.setAttribute("aria-label", label);
      menuButton.title = label;
      menuButton.setAttribute("aria-expanded", String(open));
    };

    const applyLanguage = (nextLanguage, persist = true) => {
      language = nextLanguage;
      document.documentElement.lang = language === "zh" ? "zh-CN" : "en";
      document.querySelectorAll("[data-en][data-zh]").forEach((element) => {
        element.textContent = element.dataset[language];
      });
      languageButton.querySelector("span").textContent = language === "en" ? "中" : "EN";
      const languageLabel = language === "en" ? "Switch to Chinese" : "切换到英文";
      languageButton.setAttribute("aria-label", languageLabel);
      languageButton.title = languageLabel;
      updateThemeLabel();
      updateMenuLabel();
      if (persist) {
        try { localStorage.setItem("site-language", language); } catch (_) {}
      }
    };

    languageButton.addEventListener("click", () => {
      applyLanguage(language === "en" ? "zh" : "en");
    });

    themeButton.addEventListener("click", () => {
      const dark = !body.classList.contains("dark");
      body.classList.toggle("dark", dark);
      try { localStorage.setItem("pref-theme", dark ? "dark" : "light"); } catch (_) {}
      updateThemeLabel();
    });

    menuButton.addEventListener("click", () => {
      menu.classList.toggle("is-open");
      menuButton.classList.toggle("is-open", menu.classList.contains("is-open"));
      updateMenuLabel();
    });

    navLinks.forEach((link) => {
      link.addEventListener("click", () => {
        setActiveLink(link.getAttribute("href"));
        menu.classList.remove("is-open");
        menuButton.classList.remove("is-open");
        updateMenuLabel();
      });
    });

    const sectionLinks = navLinks
      .map((link) => ({ link, section: document.querySelector(link.getAttribute("href")) }))
      .filter(({ section }) => Boolean(section));
    const updateActiveFromScroll = () => {
      if (!sectionLinks.length) return;
      const headerHeight = document.querySelector(".header")?.offsetHeight || 60;
      const scrollPaddingTop = Number.parseFloat(getComputedStyle(document.documentElement).scrollPaddingTop) || 0;
      const scrollMarginTop = Number.parseFloat(getComputedStyle(sectionLinks[0].section).scrollMarginTop) || 0;
      const activationLine = Math.max(headerHeight + 32, scrollPaddingTop + scrollMarginTop + 2);
      let activeHash = sectionLinks[0].link.getAttribute("href");

      sectionLinks.forEach(({ link, section }) => {
        if (section.getBoundingClientRect().top <= activationLine) {
          activeHash = link.getAttribute("href");
        }
      });

      const atPageEnd = window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 2;
      if (atPageEnd) activeHash = sectionLinks[sectionLinks.length - 1].link.getAttribute("href");
      setActiveLink(activeHash);
    };
    let scrollUpdateQueued = false;
    const queueActiveUpdate = () => {
      if (scrollUpdateQueued) return;
      scrollUpdateQueued = true;
      window.requestAnimationFrame(() => {
        updateActiveFromScroll();
        scrollUpdateQueued = false;
      });
    };

    window.addEventListener("scroll", queueActiveUpdate, { passive: true });
    window.addEventListener("resize", queueActiveUpdate);
    queueActiveUpdate();

    applyLanguage(language, false);
    updateThemeLabel();
  }, { once: true });
</script>
