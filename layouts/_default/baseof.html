<!doctype html>
<html lang="{{ site.Language.Locale | default site.Language.Lang }}" dir="{{ .Language.Direction | default "auto" }}">
  <head>
    {{- partial "head.html" . }}
  </head>
  <body class="{{ if .IsHome }}list home-page{{ else }}list{{ end }}" id="top">
    {{- partial "header.html" . }}
    <main class="main">
      {{- block "main" . }}{{ end }}
    </main>
    {{- partial "footer.html" . }}
  </body>
</html>
